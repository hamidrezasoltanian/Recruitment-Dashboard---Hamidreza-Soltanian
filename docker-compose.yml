version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recruitment_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment_db
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recruitment_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recruitment_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: recruitment_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://recruitment_user:${DB_PASSWORD:-recruitment_pass_2024}@postgres:5432/recruitment_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production_2024}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 3002
      FRONTEND_URL: http://localhost:80
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10485760
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3002/api/health"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: recruitment_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: http://server:3002
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
